name: Build LMMS for Raspberry Pi 5 (arm64, Cortex-A76)

# Darmowy runner ARM64 GitHub Actions. Buduje LMMS ze źródeł,
# zoptymalizowany pod Cortex-A76 (Raspberry Pi 5) + OpenMP (wielowątkowość).
on:
  workflow_dispatch:        # ręczne uruchomienie (Actions -> Run workflow)
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04-arm   # darmowy arm64 runner (Ampere/N1, kompat. z A76)
    steps:
      - uses: actions/checkout@v4

      - name: Pobierz źródła LMMS (master = najnowsze)
        run: |
          git clone --depth 1 https://github.com/LMMS/lmms.git src

      - name: Zainstaluj zależności build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev \
            qt6-tools-dev-tools qt6-svg-dev \
            libsndfile1-dev libsamplerate0-dev \
            libfftw3-dev libflac-dev libogg-dev libvorbis-dev \
            libmp3lame-dev libpulse-dev libasound2-dev \
            libjack-jackd2-dev libfluidsynth-dev zlib1g-dev \
            libsqlite3-dev libarchive-dev liblilv-dev libsuil-dev \
            libsndio-dev libgl-dev \
            libfltk1.3-dev fluid libgig-dev libsdl2-dev \
            libsoundio-dev portaudio19-dev libstk-dev libx11-dev \
            liblist-moreutils-perl

      - name: Konfiguruj (Cortex-A76 + OpenMP, lekki build bez OOM)
        run: |
          # TARGET_UARCH=custom + TARGET_UARCH_FLAGS: LMMS aplikuje flagi przez
          # add_compile_options do WSZYSTKICH targetów (rdzeń + wtyczki + 3rdparty).
          # official=armv8-a (za zachowawcze), native = kod Ampere (nie A76).
          # Wyłączamy ciężkie/opcjonalne podsystemy (LV2/SUIL, VST, GIG, Carla, Stk,
          # Sid, pakiety LADSPA CALF/CAPS/CMT/SWH/TAP, MP3Lame) => lżejszy build,
          # szybszy start, mniej RAM, mniejsze ryzyko OOM. Backendy audio wszystkie.
          cmake -S src -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTARGET_UARCH=custom \
            -DTARGET_UARCH_FLAGS="-mcpu=cortex-a76 -march=armv8.2-a+dotprod+crypto -mtune=cortex-a76 -O3 -fopenmp -pipe" \
            -DWANT_QT6=ON \
            -DWANT_ALSA=ON -DWANT_PULSEAUDIO=ON -DWANT_JACK=ON \
            -DWANT_SNDIO=ON -DWANT_PORTAUDIO=ON -DWANT_SOUNDIO=ON -DWANT_SDL=ON \
            -DWANT_SNDFILE=ON -DWANT_SF2=ON -DWANT_OGGVORBIS=ON \
            -DWANT_LV2=OFF -DWANT_SUIL=OFF \
            -DWANT_VST=OFF -DWANT_GIG=OFF -DWANT_CARLA=OFF -DWANT_STK=OFF -DWANT_SID=OFF \
            -DWANT_CALF=OFF -DWANT_CAPS=OFF -DWANT_CMT=OFF -DWANT_SWH=OFF -DWANT_TAP=OFF \
            -DWANT_MP3LAME=OFF \
            -DCMAKE_INSTALL_PREFIX=/opt/lmms

      - name: Kompiluj (wielowątkowo, bez LTO = bezpieczniej dla RAM)
        run: cmake --build build -j"$(nproc)"

      - name: Instaluj do katalogu staging
        run: cmake --install build --prefix /tmp/lmms-install

      # DŹWIĘK: dołącz domyślny ~/.lmmsrc.xml wymuszający backend PulseAudio.
      # Bez tego LMMS na Pi wybiera backend ALSA (pomija routing PipeWire) -> cisza.
      # Po rozpakowaniu skopiuj go do swojego katalogu domowego (patrz README).
      - name: Dołącz domyślny config (PulseAudio przez pipewire-pulse)
        run: |
          cp config/lmmsrc.xml /tmp/lmms-install/lmmsrc.xml
          echo "Zawartość lmmsrc.xml (backend audio):"
          grep audiodev /tmp/lmms-install/lmmsrc.xml

      - name: Pakuj wynik
        run: |
          tar -C /tmp/lmms-install -czf lmms-pi5-arm64.tar.gz .
          sha256sum lmms-pi5-arm64.tar.gz > lmms-pi5-arm64.tar.gz.sha256
          ls -la lmms-pi5-arm64.tar.gz

      - name: Wgraj jako artifact
        uses: actions/upload-artifact@v4
        with:
          name: lmms-pi5-arm64
          path: |
            lmms-pi5-arm64.tar.gz
            lmms-pi5-arm64.tar.gz.sha256
